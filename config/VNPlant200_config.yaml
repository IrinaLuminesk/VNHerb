# GPUS: (0,1,2,3)
# WORKERS: 4
# PRINT_FREQ: 1

DDP_TRAIN: FALSE

DATASET:
  DATASET_NAME: PLANTVILLAGE
  ROOT: "../datasets"
  ROOT_FOLDER: "/content/VNPlant200_train"
  TRAIN_FOLDER: "/content/VNPlant200_train"
  TEST_FOLDER: "/content/VNHerb_test"
  ZIP_FOLDER: "./datasets/Cifar10.zip"
  SELECTION_RATIO: 1
  SPLIT_RATIO: 0.7

DATASET_EXTRACT:
  DATASET_INFO: "../Info.csv"
  ZIP_FILE_PATH: "../Dataset/Ảnh"
  EXTRACT_PATH: "../DTLHerb"
  MIN_IMG: 100
  MAX_IMG: 9999

TRAIN:
  DATA:
    IMAGE_SIZE: [256, 256]
    BATCH_SIZE: 64
    SHUFFLE: True
    #VNPlant_Train
    # MEAN: [0.4960195,  0.5356709,  0.39059685] 
    # STD: [0.19495438, 0.19572471, 0.18908845]
    #VNHerb
    MEAN: [0.5261429, 0.54821551, 0.42929574] 
    STD: [0.20448453, 0.20582635, 0.2034693 ]
  
  TRAIN_PARA:
    MODEL_TYPE: 1 #{1: Resnet50, 2: DenseNet201, 3: VGG19, 4: ConvNeXt_Large, 5: MobileNet}
    BEGIN_EPOCH: 0
    END_EPOCH: 50
    LAST_EPOCH: 0
    OPTIMIZER: "AdamW"
    RESUME: False
    EARLY_STOPPING: FALSE
    PATIENCE: 10
  OPTIONAL:
    SAVE_CHECKPOINT: TRUE
    CHECKPOINT_PATH: "./resume_model/checkpoint.pth"
    SAVE_BEST: TRUE
    BEST_PATH: "./best_model/best_checkpoint.pth"
    SAVE_METRICS: TRUE
    METRICS_PATH: "./metrics/metrics.csv"
  AUG:
    ENABLED: TRUE
    CUTMIX: [TRUE, 0.5]
    MIXUP: [TRUE, 0.5]
    FMIX: [TRUE, 0.5]
  TRANSFORM: TRUE
  LEARNING_RATE:
    PieceWise:
      START_LR: 0.0001
      MAX_LR: 0.0005
      MIN_LR: 0.0001
      RAMPUP_EPOCHS: 10
      SUSTAIN_EPOCHS: 5
      EXP_DECAY: 0.8
    WarmupCosine: 
      START_LR: 0.00001
      MAX_LR: 0.00005
      MIN_LR: 0.00003
      RAMPUP_EPOCHS: 5
      SUSTAIN_EPOCHS: 30
      COS_DECAY: 15
TEST:
  BATCH_SIZE: 32

